# EC11 rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio unlocked while hardware keys are not populated yet
CONFIG_ZMK_STUDIO_LOCKING=n

# ST7789 TFT
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# Color UI objects and a separate static RGB565 drawing buffer.
# 20% of 320x172 = 22016 bytes; never allocate a full framebuffer.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# 4x WS2812B on P0.06 through SPIM3 (Zephyr 3.5 / ZMK v0.3)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Widgets
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# LVGL widgets
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_CANVAS=y

# Fonts
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Album artwork transport
CONFIG_BASE64=y

# Power saving: screensaver after 60s idle, deep sleep after 120s on battery
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=120000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
