name: Publish LumiPad latest release

on:
  push:
    branches: [ main ]
    paths:
      - "pc-app/**"
      - "boards/**"
      - "config/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/windows-app.yml"
      - ".github/workflows/publish-latest.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release versions
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' pc-app/LumiPad.App/LumiPad.App.csproj)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "firmware_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fw
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow build.yml --commit "$SHA" --limit 10 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status=="completed" and .conclusion=="success")][0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              gh run download "$RUN_ID" -n firmware -D dist/fw
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for firmware workflow"
          exit 1

      - name: Wait for self-contained Windows app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow windows-app.yml --commit "$SHA" --limit 10 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status=="completed" and .conclusion=="success")][0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              gh run download "$RUN_ID" -n Lumi-Macropad-Windows-x64 -D dist/app
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Windows app workflow"
          exit 1

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release

          UF2=$(find dist/fw -type f -iname '*.uf2' | head -n 1)
          if [ -z "$UF2" ]; then
            echo "No UF2 found in firmware artifact"
            exit 1
          fi

          cp "$UF2" dist/release/firmware.uf2

          cd dist/app
          zip -r ../release/LumiPad-Windows-x64.zip .
          cd ../..

          cat > dist/release/release-manifest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "appVersion": "${{ steps.version.outputs.app_version }}",
            "firmwareVersion": "${{ steps.version.outputs.firmware_version }}",
            "commit": "$SHA",
            "firmware": "firmware.uf2",
            "app": "LumiPad-Windows-x64.zip"
          }
          EOF

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/release/firmware.uf2 \
              dist/release/LumiPad-Windows-x64.zip \
              dist/release/release-manifest.json \
              --clobber
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --title "LumiPad ${{ steps.version.outputs.version }}" \
              --notes "Automatic DIAL DESK firmware and LumiPad Windows app update package." \
              dist/release/firmware.uf2 \
              dist/release/LumiPad-Windows-x64.zip \
              dist/release/release-manifest.json
          fi
