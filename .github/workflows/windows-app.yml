name: Build LumiPad Windows app

on:
  push:
    branches: [ main ]
    paths:
      - "pc-app/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate LumiPad icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = Join-Path $PWD "pc-app\LumiPad.App\Assets\LumiPad.ico"
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Black)
          $font = New-Object System.Drawing.Font("Arial", 78, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(232,229,225))
          $text = "L3D"
          $size = $g.MeasureString($text, $font)
          $g.DrawString($text, $font, $brush, (256-$size.Width)/2, (256-$size.Height)/2)
          $handle = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create($ico)
          $icon.Save($stream)
          $stream.Close()
          $icon.Dispose()
          $brush.Dispose()
          $font.Dispose()
          $g.Dispose()
          $bmp.Dispose()

      - name: Restore
        run: dotnet restore pc-app/LumiPad.App/LumiPad.App.csproj

      - name: Publish
        run: >
          dotnet publish pc-app/LumiPad.App/LumiPad.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/LumiPad

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LumiPad-Windows-x64
          path: publish/LumiPad/**
